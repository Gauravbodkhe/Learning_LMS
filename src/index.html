<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>AdaptiveLMS | Intelligent Learning Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Adaptive Learning Management System with Rule-Based Competency Engine for B.Tech Computer Science and Engineering.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('lms_adaptive_ui_theme');
        if (saved) {
          var theme = JSON.parse(saved);
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            return;
          }
        }
        document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
